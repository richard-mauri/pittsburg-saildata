<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full report details — Mauri's Weather & Water Conditions</title>
<style>:root{--navy:#082b45;--blue:#126b91;--ink:#153242;--muted:#607886;--paper:#f5fafc;--card:#fff;--line:#d8e7ed}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}a{color:var(--blue)}.back{display:inline-block;margin-bottom:18px;text-decoration:none;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}h1{margin:0 0 6px;color:var(--navy);font-size:clamp(1.5rem,4vw,2.2rem)}.meta{color:var(--muted);margin-bottom:18px}.yogiism{text-align:center;color:var(--muted);font-style:italic;font-size:.9rem;margin:18px auto 0;max-width:760px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
/* ScraperGo-aligned semantic theme; preserve sailing hazard and current-series colors. */
:root{color-scheme:light dark;--bg:light-dark(#f5f5f0,#0e141a);--panel:light-dark(#ffffff,#19232b);--ink:light-dark(#182631,#eef2f4);--muted:light-dark(#60707b,#a5b3bb);--border:light-dark(#dce2e1,#34434a);--accent:light-dark(#126877,#69c6d3);--soft:light-dark(#e6f3f3,#203c43);--navy:var(--ink);--blue:var(--accent);--sea:var(--accent);--paper:var(--bg);--card:var(--panel);--line:var(--border);--shadow:0 10px 35px light-dark(#17253408,#00000020)}
body{background:var(--bg);color:var(--ink)}
a{color:var(--accent)}
.card,.controls,.paper,.paynotice{background:var(--panel);border-color:var(--border);box-shadow:var(--shadow)}
.metric,.wind-summary,.badge,.topic-links a{background:var(--soft);color:var(--ink)}
button,input,select,textarea{font:inherit;color:var(--ink);border-color:var(--border)}
input,select,textarea{background:var(--panel)}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head><body><main><a class="back" href="javascript:history.back()">← Back to conditions</a><div class="card"><h1>Full report details</h1><div class="meta">{{.Title}}{{if .ReportTime}} · {{.ReportTime}}{{end}} · Version {{.AppVersion}} · Build {{.BuildVersion}}</div><pre>{{.FullText}}</pre></div>{{if .Yogiism}}<div class="yogiism">“{{.Yogiism}}” — Yogi Berra</div>{{end}}</main></body></html>
