<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full report details — Mauri's Weather & Water Conditions</title>
<style>:root{--navy:#082b45;--blue:#126b91;--ink:#153242;--muted:#607886;--paper:#f5fafc;--card:#fff;--line:#d8e7ed}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}a{color:var(--blue)}.back{display:inline-block;margin-bottom:18px;text-decoration:none;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}h1{margin:0 0 6px;color:var(--navy);font-size:clamp(1.5rem,4vw,2.2rem)}.meta{color:var(--muted);margin-bottom:18px}.yogiism{text-align:center;color:var(--muted);font-style:italic;font-size:.9rem;margin:18px auto 0;max-width:760px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.suite-home-link{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:38px;margin:0 0 16px;padding:8px 12px;border:1px solid rgba(103,170,190,.62);border-radius:10px;background:rgba(96,151,172,.10);color:var(--accent,#69c6d3);font:700 14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}.suite-home-link:hover{background:rgba(96,151,172,.22);border-color:var(--accent,#69c6d3);text-decoration:none}.suite-home-link:focus-visible{outline:2px solid var(--accent,#69c6d3);outline-offset:3px}.suite-home-link:active{background:rgba(96,151,172,.30)}
</style>
</head><body><main><a class="suite-home-link" href="https://home.themauris.org/">← Back to Homepage</a><a class="back" href="javascript:history.back()">← Back to conditions</a><div class="card"><h1>Full report details</h1><div class="meta">{{.Title}}{{if .ReportTime}} · {{.ReportTime}}{{end}} · Version {{.AppVersion}} · Build {{.BuildVersion}}</div><pre>{{.FullText}}</pre></div>{{if .Yogiism}}<div class="yogiism">“{{.Yogiism}}” — Yogi Berra</div>{{end}}</main></body></html>
